spring:
  application:
    name: api-pagos-tarjetas

  # ===============================
  # CONFIGURACIÓN DE MONGODB
  # ===============================
  data:
    mongodb:
      uri: mongodb://localhost:27017/api_pagos_tarjetas
      # Alternativa con autenticación:
      # uri: mongodb://username:password@localhost:27017/api_pagos_tarjetas
      auto-index-creation: true

  # ===============================
  # CONFIGURACIÓN DE JACKSON (JSON)
  # ===============================
  jackson:
    serialization:
      fail-on-empty-beans: false
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    time-zone: America/Argentina/Buenos_Aires
    default-property-inclusion: non_null

  # ===============================
  # VIRTUAL THREADS (Java 21)
  # ===============================
  threads:
    virtual:
      enabled: true

# ===============================
# CONFIGURACIÓN DEL SERVIDOR
# ===============================
server:
  port: 8081
  servlet:
    context-path: /dbd/v2
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# ===============================
# CONFIGURACIÓN DE LOGGING
# ===============================
logging:
  level:
    root: INFO
    com.dbd.service.pagos_tarjetas: DEBUG
    org.springframework.data.mongodb.core: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/api-pagos-tarjetas.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

# ===============================
# CONFIGURACIÓN DE SPRINGDOC OPENAPI (SWAGGER)
# ===============================
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: alpha
    tagsSorter: alpha
    doc-expansion: none
    display-request-duration: true
    filter: true
  packages-to-scan: com.dbd.service.pagos_tarjetas.rest.controller
  show-actuator: false

# ===============================
# CONFIGURACIÓN DE ACTUATOR
# ===============================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
